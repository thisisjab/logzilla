name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64, linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    name: Build and Release Binaries
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create release directory
        run: mkdir -p dist

      - name: Build Linux AMD64
        run: GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/logzilla-linux-amd64 ./cmd/engine

      - name: Build Linux ARM64
        run: GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/logzilla-linux-arm64 ./cmd/engine

      - name: Build Windows AMD64
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/logzilla-windows-amd64.exe ./cmd/engine

      - name: Build macOS AMD64
        run: GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/logzilla-darwin-amd64 ./cmd/engine

      - name: Build macOS ARM64
        run: GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/logzilla-darwin-arm64 ./cmd/engine

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/logzilla-linux-amd64
            dist/logzilla-linux-arm64
            dist/logzilla-windows-amd64.exe
            dist/logzilla-darwin-amd64
            dist/logzilla-darwin-arm64
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
