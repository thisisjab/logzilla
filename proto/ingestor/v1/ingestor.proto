syntax = "proto3";

package ingestor.v1;

option go_package = "github.com/thisisjab/logzilla/gen/ingestor/v1;ingestorv1";

service IngestorService {
  rpc PollWAL(PollWALRequest) returns (stream PollWALResponse);
}

message PollWALRequest {
  int64 last_wal_id = 1;
}

message PollWALResponse {
  int64 wal_id = 1;
  bytes data = 2;
}
